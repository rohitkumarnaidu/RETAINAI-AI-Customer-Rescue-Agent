# RETAINAI — docker-compose prod-like defaults (Phase 5 Infra Hardening)
# Prod-like: AUTH_ENABLED=true, DEMO_MODE=false, DATABASE_URL=postgresql+asyncpg
# For local demo/hackathon reliability, override via .env or docker-compose.override.yml:
#   AUTH_ENABLED=false
#   DEMO_MODE=true
#   DATABASE_URL=sqlite+aiosqlite:///./retainai.db   # dev fallback only, not for multi-tenant prod
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data:ro
    environment:
      # --- Database: sqlite fallback for demo reliability (postgres also works after timezone fix) ---
      # Prod-like would be: postgresql+asyncpg://retainai:retainai@db:5432/retainaidb
      - DATABASE_URL=sqlite+aiosqlite:///./retainai.db
      # --- Auth: demo bypass enabled for hackathon (image shows DEMO_MODE=true) ---
      # Prod hardening would be AUTH_ENABLED=true DEMO_MODE=false
      - AUTH_ENABLED=false
      - DEMO_MODE=true
      # --- LLM proxy (BYOK per tenant overrides global; see /org/settings) ---
      # LIVE BRANCH: requires real GROQ_API_KEY=gsk_... or OPENAI_API_KEY=sk_... / LLM_API_KEY — mock_key_for_dev disabled, no mock fallback
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-retainai-dev-secret-change-in-prod}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-retainai-dev-app-secret-change-in-prod-32chars}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    # readiness probe also available at /readiness (DB SELECT 1) — see main.py:238

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: retainai
      POSTGRES_PASSWORD: retainai
      POSTGRES_DB: retainaidb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retainai -d retainaidb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
